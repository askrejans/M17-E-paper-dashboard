[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800

build_src_filter = +<*>
test_build_src = true

build_flags =
; secrets are generated at build-time into include/secrets.h
; Display driver selection (default: GDEM075F52 4-color ACeP)
; Uncomment one of these to use a different driver:
;   -DEPD_DRIVER_WAVESHARE75BW
;   -DEPD_DRIVER_CUSTOM
extra_scripts = build/generate_secrets.py

lib_deps =
  esp32async/AsyncTCP@^3.4.10
  esp32async/ESPAsyncWebServer@^3.10.3
  bblanchon/ArduinoJson@^7.4.3

lib_ignore =
  WebServer
  ESP32WebServer
