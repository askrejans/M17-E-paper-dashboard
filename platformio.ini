; M17 E-Paper Dashboard
;   pio run                       build firmware (esp32dev)
;   pio run -t upload             flash firmware
;   pio test -e native            run unit tests on the host (no hardware)
;   pio run -e preview && .pio/build/preview/program   render PNG-able BMPs of all themes

[platformio]
default_envs = esp32dev

[env:esp32dev]
; pioarduino: Arduino-ESP32 3.3.x (ESP-IDF 5.5). The official espressif32
; platform still ships Arduino 2.0.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800

; 2x 1.9 MB app slots (OTA from the admin panel) + 128 KB LittleFS for config
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DARDUINOJSON_ENABLE_NAN=1
; Display driver selection (default: GDEM075F52 4-colour ACeP):
;   -DEPD_DRIVER_WAVESHARE75BW
;   -DEPD_DRIVER_CUSTOM
; Boards with PSRAM (e.g. ESP32-WROVER): -DBOARD_HAS_PSRAM

; build/generate_secrets.py: optional .env -> include/secrets.h (first-boot defaults)
; build/embed_web.py: web/* -> gzipped PROGMEM assets (include/generated/web_assets.h)
extra_scripts =
  pre:build/generate_secrets.py
  pre:build/embed_web.py

lib_deps =
  esp32async/AsyncTCP@^3.5.0
  esp32async/ESPAsyncWebServer@^3.12.1
  bblanchon/ArduinoJson@^7.4.3

lib_ignore =
  WebServer
  ESP32WebServer

test_ignore = test_native

; ── Host builds ──────────────────────────────────────────────────
[native_common]
platform = native
build_flags =
  -std=gnu++17
  -Iinclude
  -DARDUINOJSON_ENABLE_NAN=1
  -DM17_NO_SECRETS
  -Wno-c99-designator
  -Wno-unknown-warning-option
lib_deps =
  bblanchon/ArduinoJson@^7.4.3
build_src_filter =
  -<*>
  +<core/>
  +<utils/pure_utils.cpp>
  +<display/drawing.cpp>
  +<display/widgets.cpp>
  +<display/themes/>
  +<font_8x16.cpp>
  +<font8x16_basic.cpp>
  +<lang.cpp>

[env:native]
platform = ${native_common.platform}
build_flags = ${native_common.build_flags}
lib_deps = ${native_common.lib_deps}
build_src_filter = ${native_common.build_src_filter}
test_filter = test_native
test_build_src = yes

[env:preview]
platform = ${native_common.platform}
build_flags = ${native_common.build_flags}
lib_deps = ${native_common.lib_deps}
build_src_filter = ${native_common.build_src_filter} +<../tools/preview/>
